<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hackzilla — Listen to Dublin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,650;1,9..144,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="frontend/landing.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="top">
    <a class="mark" href="index.html">
      <span class="mark-dot" aria-hidden="true"></span>
      Hackzilla
    </a>
    <p class="top-meta">RoAI Hackathon · Dublin City Council</p>
  </header>

  <main class="hero">
    <div class="copy">
      <p class="eyebrow">Dublin noise intelligence</p>
      <h1>
        <span class="line">The city,</span>
        <span class="line italic">in decibels.</span>
      </h1>
      <p class="lede">Sixty monitors. Quieter greens, louder reds. A map that lets you hear Dublin before you go.</p>
      <a class="enter" href="frontend/index.html">
        <span>Enter the map</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h12M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>

    <aside class="wave-panel" aria-hidden="true">
      <svg class="wave" viewBox="0 0 640 240" preserveAspectRatio="xMidYMid meet">
        <path class="fill" d="M0 120 C 40 40, 80 200, 120 120 S 200 20, 240 120 S 320 220, 360 120 S 440 30, 480 120 S 560 200, 640 120 V 240 H 0 Z"/>
        <path class="w a" fill="none" stroke="#fff8eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M0 120 C 40 40, 80 200, 120 120 S 200 20, 240 120 S 320 220, 360 120 S 440 30, 480 120 S 560 200, 640 120"/>
        <path class="w b" fill="none" stroke="#d4a056" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M0 120 C 48 190, 96 50, 144 120 S 240 210, 288 120 S 384 40, 432 120 S 528 185, 640 120"/>
      </svg>
    </aside>
  </main>

  <footer class="rail">
    <div>
      <span>Stations</span>
      <strong>60</strong>
    </div>
    <div>
      <span>Quiet</span>
      <strong>20–60</strong>
    </div>
    <div>
      <span>Busy</span>
      <strong>60–80</strong>
    </div>
    <div>
      <span>Loud</span>
      <strong>80+</strong>
    </div>
  </footer>
</body>
</html>
